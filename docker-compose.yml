services:
  # --- MongoDB (Messages & Blocked Users) ---
  mongodb:
    image: mongo:4.4
    container_name: chat_app-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s
    # PRODUCTION: Enable authentication
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}

  # --- Redis (Presence & Caching) ---
  redis:
    image: redis:alpine
    container_name: chat_app-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s
    # PRODUCTION: Enable password authentication
    # command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    # Then update healthcheck to:
    # test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']

  # --- RabbitMQ (Microservice Communication) ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chat_app-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'       # AMQP protocol
      - '15672:15672'     # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s
    # PRODUCTION: Set custom credentials
    # environment:
    #   RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
    #   RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-changeme}

  # --- PostgreSQL (Users, Rooms, Members) ---
  postgres:
    image: postgres:16-alpine
    container_name: chat_app-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-chatapp}
    ports:
      - '5433:5432'       # Mapped to 5433 to avoid conflict with local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-chatapp}']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s

volumes:
  rabbitmq_data:
  postgres_data:
  mongodb_data:
  redis_data: