services:
  mongodb:
    image: mongo:latest
    container_name: chat_app-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '--eval', 'db.runCommand("ping").ok']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s
  redis:
    image: redis:alpine
    container_name: chat_app-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chat_app-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 60s
  postgres:
    image: postgres:16-alpine
    container_name: chat_app-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-chatapp}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  rabbitmq_data:
  postgres_data:
  mongodb_data:
  redis_data: